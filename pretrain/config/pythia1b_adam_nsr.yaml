## Adam-NSR config for EleutherAI/pythia-1b.
## Download GPT-2-tokenized FineWeb bins before launching.

deterministic: False
seed: 100

trainset_bin_dir: "./data/fineweb100B"
validset_bin_dir: "./data/fineweb100B"
validset_path: null
valid_tokens: null

vocab_size: 50304
seq_len: 2048
sampler: "sequential"
sampler_seed: null
num_workers: 4

eval: True
eval_every_steps: 200
eval_rank0_only: False

model: "pythia-1b"
torch_compile: True

steps_budget: 390625
micro_batch_size: 2
grad_accumulation_steps: 64
dtype: "bfloat16"

optim: "adam_nsr"
fused_optim: True
lr: 1.e-3
weight_decay: 0.0
beta1: 0.90
beta2: 0.90
eps: 1.e-8
grad_clip: 1.0

y_max: 64.0
moment1_dtype: "fp32"
moment1_quant: "per_column"
moment2_dtype: "fp32"
pseudo_quantize_state_dtype: null
nsr_compute_dtype: "fp32"
skip_update_on_bad_y: False

scheduler: "warmup_constant"
warmup_steps: 1024
cooldown_steps: null
lr_start: 0.0
lr_end: null
lr_end_pct: null

log_every_steps: 1
print_progress: True

use_wandb: False
wandb_entity: null
wandb_project: "plainlm"
wandb_dir: "./wandb"
wandb_run_name: "pythia1b_adam_nsr"
exp_name: "pythia1b_adam_nsr"
out_dir: "./outputs"
over_write: True

resume: False
resume_mode: null
resume_step: null
resume_exp_name: null
resume_dir: null
wandb_continuation_mode: "fresh"

train_shard_start: 0
train_shard_budget: null

save_last_checkpoint: False
save_intermediate_checkpoints: False
save_every_steps: null
