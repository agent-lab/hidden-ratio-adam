## Minimal Adam-NSR training config.
## Replace the dataset and output paths before launching.

deterministic: False
seed: 100

trainset_path: "./data/example_dataset/ctx_2048/train"
vocab_size: 50280
seq_len: 2048
sampler: "sequential"
sampler_seed: null
num_workers: 4

eval: False
validset_path: null
eval_every_steps: null

model: "transformer"
d_model: 768
mlp_class: "glu"
expand: "8/3"
n_layers: 12
n_heads: 12
rms_norm: True
tie_embeddings: False
qk_norm: True
embed_norm: True
torch_compile: True

steps_budget: 4800
micro_batch_size: 32
grad_accumulation_steps: 8
dtype: "bfloat16"

optim: "adam_nsr"
fused_optim: False
lr: 3.e-3
weight_decay: 0.1
beta1: 0.90
beta2: 0.90
eps: 1.e-8
grad_clip: 1.0

# Adam-NSR options. This table is the 16-value table used in the reference runs.
y_max: 64.0
moment1_dtype: "fp32"
moment1_quant: "per_column"
moment2_dtype: "fp32"
pseudo_quantize_state_dtype: null
nsr_compute_dtype: "fp32"
skip_update_on_bad_y: False

scheduler: "warmup_cosine"
warmup_steps: 0.1
cooldown_steps: null
lr_start: 0.0
lr_end: 1.e-5
lr_end_pct: null

log_every_steps: 1
print_progress: True

use_wandb: False
wandb_entity: null
wandb_project: "plainlm"
wandb_dir: "./wandb"
wandb_run_name: "adam_nsr_run"
exp_name: "adam_nsr_run"
out_dir: "./outputs"
over_write: True

resume: False
resume_step: null
resume_exp_name: null

save_last_checkpoint: False
save_intermediate_checkpoints: False
save_every_steps: null
